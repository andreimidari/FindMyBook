name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate plugin.json
        run: |
          set -euo pipefail
          for key in ID Name Author Version Language Website ExecuteFileName IcoPath; do
            value="$(jq -r --arg key "$key" '.[$key] // empty' plugin.json)"
            if [ -z "$value" ]; then
              echo "::error::plugin.json is missing $key"
              exit 1
            fi
          done

          ID="$(jq -r '.ID' plugin.json)"
          if ! printf '%s' "$ID" | grep -Eq '^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'; then
            echo "::error::plugin.json ID must be a UUID"
            exit 1
          fi

          for file in "$(jq -r '.ExecuteFileName' plugin.json)" "$(jq -r '.IcoPath' plugin.json)"; do
            if [ ! -f "$file" ]; then
              echo "::error::plugin.json references a missing file: $file"
              exit 1
            fi
          done

      - name: Read version from plugin.json
        id: version
        run: |
          set -euo pipefail
          VERSION="$(jq -r '.Version' plugin.json)"
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "::error::Could not read Version from plugin.json"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Verify tag matches plugin.json
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$TAG_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin.json Version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Remove runtime artifacts
        run: |
          set -euo pipefail
          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          rm -rf img_cache debug.log

      - name: Build release zip
        run: |
          set -euo pipefail

          INCLUDE=()
          for file in main.py plugin.json README.md LICENSE requirements.txt; do
            if [ -f "$file" ]; then
              INCLUDE+=("$file")
            fi
          done

          if [ -d Lib ]; then
            INCLUDE+=("Lib")
          fi

          for image in *.png; do
            if [ -f "$image" ]; then
              INCLUDE+=("$image")
            fi
          done

          zip -r FindMyBook.zip "${INCLUDE[@]}" \
            -x '*/__pycache__/*' '*.pyc' '*.pyo'

          echo "Release zip contents:"
          unzip -l FindMyBook.zip
          LISTING="$(unzip -l FindMyBook.zip)"

          if ! grep -q 'main.py' <<< "$LISTING"; then
            echo "::error::Release zip is missing main.py"
            exit 1
          fi
          if ! grep -q 'plugin.json' <<< "$LISTING"; then
            echo "::error::Release zip is missing plugin.json"
            exit 1
          fi
          if ! grep -q 'app.png' <<< "$LISTING"; then
            echo "::error::Release zip is missing app.png"
            exit 1
          fi
          if grep -Eq '__pycache__|\.pyc|\.pyo|img_cache/|debug\.log' <<< "$LISTING"; then
            echo "::error::Release zip contains runtime artifacts"
            exit 1
          fi

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: FindMyBook.zip
          tag_name: v${{ steps.version.outputs.version }}
          name: FindMyBook ${{ steps.version.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
